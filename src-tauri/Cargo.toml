[package]
name = "kairo"
version = "0.1.3"
description = "A calm, local-first focus timer, Pomodoro companion, and study tracker."
authors = ["Rudra Pratap Singh"]
license = "MIT"
repository = "https://github.com/Rudra78996/kairo"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-localhost = "2.3.2"
